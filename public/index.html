<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beach Volley Leucate — une partie ?</title>
<meta name="theme-color" content="#64788a">
<link rel="preload" as="image" href="/court.jpg">
<link rel="stylesheet" href="/style.css">
<style>
  /* The court itself, behind everything. The photo is pale sand under pale
     sky, so a scrim is doing real work here: without it the white brand
     text disappears and the card stops reading as a separate surface. */
  html {
    min-height: 100%;
    background:
      linear-gradient(180deg, rgba(6,20,34,0.50) 0%, rgba(6,20,34,0.28) 42%, rgba(6,20,34,0.62) 100%),
      url("/court.jpg") center / cover no-repeat;
    background-color: #b8c4cc; /* sky-ish, shows only while the photo loads */
  }
  /* style.css paints an opaque body, which would sit on top of the photo. */
  body { background: transparent; }

  .brand { color: #fff; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.55); }
  .card { box-shadow: 0 12px 34px rgba(0, 0, 0, 0.30); }

  /* One card carries the whole page, so the message itself has to be the
     headline - sized to stay readable at arm's length in the sun. */
  .lead {
    margin: 0;
    font-size: clamp(20px, 5.6vw, 25px);
    line-height: 1.42;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .hero.go .lead   { color: var(--go-ink); }
  .hero.stop .lead { color: var(--stop); }

  #actions { margin-top: 26px; }

  .confirm-q { margin: 0 0 12px; font-size: 18px; font-weight: 700; }
  .confirm-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .confirm-row .yes {
    padding: 20px 12px; font-size: 18px; font-weight: 750;
    background: var(--go); color: #fff; box-shadow: 0 2px 0 #06491e;
  }
  .confirm-row .no {
    padding: 20px 12px; font-size: 18px; font-weight: 650;
    background: #fff; border-color: var(--line); color: var(--ink);
  }
  #msg { margin-top: 20px; text-align: left; }
</style>
</head>
<body>
<main>
  <div class="brand"><span aria-hidden="true">🏐</span> Beach Volley Leucate</div>

  <section id="card" class="card hero" aria-live="polite">
    <p id="cardText" class="lead">Un instant…</p>

    <div id="actions" hidden>
      <button id="notifyBtn" class="big" type="button">Nous prévenir</button>

      <div id="confirmBox" hidden>
        <p class="confirm-q">Envoyer la notification ?</p>
        <div class="confirm-row">
          <button id="confirmYes" class="yes" type="button">Oui, envoyer</button>
          <button id="confirmNo" class="no" type="button">Annuler</button>
        </div>
      </div>
    </div>

    <p id="msg" class="note" hidden></p>
  </section>
</main>

<script>
const el = (id) => document.getElementById(id);

const TEXT_AVAILABLE = "On est bien juste à coté et dispo pour jouer, Si vous continuez on recevra une notification et on vient dans les prochaines minutes.";
const TEXT_UNAVAILABLE = "Désolé on est pas dans le coin pour le moment, essayez plus tard.";
const TEXT_ALREADY = "On vient d'être prévenus, on arrive dans les prochaines minutes.";

let status = null;
let confirming = false;

function render() {
  if (!status) return;

  // Availability comes from the stored expiry, but no time is ever shown -
  // the button being there is the whole message.
  const live = status.available && (!status.availableUntil || Date.parse(status.availableUntil) > Date.now());
  const cooling = Math.max(0, status.cooldownRemainingMs - (Date.now() - status.fetchedAt)) > 0;
  const canNotify = live && status.notifyConfigured && !cooling;

  el('card').className = 'card hero ' + (canNotify || (live && cooling) ? 'go' : 'stop');
  el('actions').hidden = !canNotify;

  if (canNotify) {
    el('cardText').textContent = TEXT_AVAILABLE;
  } else if (live && cooling) {
    el('cardText').textContent = TEXT_ALREADY;
  } else {
    // Unavailable, and also the case where notifications are broken: from
    // out here the outcome is identical, and /admin already warns the team.
    el('cardText').textContent = TEXT_UNAVAILABLE;
    resetConfirm();
  }
}

function resetConfirm() {
  confirming = false;
  el('confirmBox').hidden = true;
  el('notifyBtn').hidden = false;
  el('notifyBtn').disabled = false;
  el('notifyBtn').textContent = 'Nous prévenir';
}

function say(text, kind) {
  const m = el('msg');
  m.textContent = text;
  m.className = 'note' + (kind ? ' ' + kind : '');
  m.hidden = false;
}

async function refresh() {
  if (confirming) return; // don't yank the UI away mid-confirmation
  try {
    const res = await fetch('/api/status', { cache: 'no-store' });
    status = await res.json();
    status.fetchedAt = Date.now();
    render();
  } catch {
    el('card').className = 'card hero stop';
    el('cardText').textContent = 'Pas de connexion. Vérifiez votre réseau et rafraîchissez la page.';
    el('actions').hidden = true;
  }
}

el('notifyBtn').addEventListener('click', () => {
  confirming = true;
  el('msg').hidden = true;
  el('notifyBtn').hidden = true;
  el('confirmBox').hidden = false;
});

el('confirmNo').addEventListener('click', () => {
  resetConfirm();
  refresh();
});

el('confirmYes').addEventListener('click', async () => {
  el('confirmYes').disabled = true;
  el('confirmNo').disabled = true;
  el('confirmYes').textContent = 'Envoi…';

  try {
    const res = await fetch('/api/notify', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: '{}',
    });
    const body = await res.json();
    confirming = false;
    status = { ...body, fetchedAt: Date.now() };

    if (res.ok) {
      say("C'est fait, on a été prévenus. On arrive !", 'ok');
    } else if (body.error === 'cooldown') {
      say("On vient déjà d'être prévenus, on arrive.", null);
    } else if (body.error === 'not_available') {
      say('On vient de se rendre indisponibles, désolé.', 'err');
    } else if (body.error === 'not_configured') {
      say("Les notifications ne sont pas configurées.", 'err');
    } else {
      say("Impossible d'envoyer le message. Réessayez dans un instant.", 'err');
    }
  } catch {
    confirming = false;
    say('Erreur réseau — réessayez.', 'err');
  }

  el('confirmYes').disabled = false;
  el('confirmNo').disabled = false;
  el('confirmYes').textContent = 'Oui, envoyer';
  el('confirmBox').hidden = true;
  el('notifyBtn').hidden = false;
  el('notifyBtn').textContent = 'Nous prévenir';
  render();
});

refresh();
setInterval(refresh, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
